<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Nothing Here</title>
    <style>
        :root {
            --bg: #0d1117;
            --text: #e6edf3;
            --muted: #848d97;
            --border: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #30363d;
            --btn-text: #c9d1d9;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --text: #1f2328;
                --muted: #656d76;
                --border: #d0d7de;
                --btn-bg: #f6f8fa;
                --btn-hover: #f3f4f6;
                --btn-text: #24292f;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon {
            width: 96px;
            height: 96px;
            margin-bottom: 2rem;
            color: var(--muted);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 9px 18px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <path d="m9.5 12.5 5 5"/>
            <path d="m14.5 12.5-5 5"/>
        </svg>
        <h1>Oops! Nothing here.</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
        <a href="/" class="btn">Return Home</a>
    </div>
</body>
</html>
